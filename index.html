<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Uploader</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; padding: 1rem; background: #1e1e1e; color: #eee; }
        input, button, select { display: block; width: 100%; padding: 0.6rem; margin-bottom: 1rem; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #eee; }
        button { cursor: pointer; background: #4a6cf7; border: none; font-weight: bold; }
        button:hover { background: #3a5ce0; }
        h1, h2 { color: #fff; }
        #status { margin-top: 1rem; font-weight: bold; color: #6fcf97; }
        .error { color: #eb5757 !important; }
        #upload-section { display: none; }
        #auth-section { display: block; }
    </style>
</head>
<body>
    <h1>Skin Uploader</h1>

    <div id="auth-section">
        <h2>Sign In</h2>
        <input type="text" id="username" placeholder="Minecraft Username">
        <input type="password" id="password" placeholder="Password">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFAZJwQmsuxmzQ1P" data-theme="dark"></div>
        <button id="login-btn">Sign In</button>
        <button id="signup-btn" style="background:#555;">Sign Up</button>
    </div>

    <div id="upload-section">
        <h2>Hello, <span id="user-email"></span></h2>
        <input type="text" id="minecraft-username" placeholder="Minecraft Username">
        <select id="skin-model">
            <option value="default">Classic (Steve)</option>
            <option value="slim">Slim (Alex)</option>
        </select>
        <input type="file" id="skin-file" accept="image/png">
        <button id="upload-btn">Upload Skin</button>
        <button id="logout-btn" style="background:#555;">Sign Out</button>
    </div>

    <div id="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xmcqllhmkqbmglophbvs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtY3FsbGhta3FibWdsb3BoYnZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTg3NDIsImV4cCI6MjEwNTY3NDc0Mn0.mzD12QmAdO19RGJHFlFlGhQ827dPgfyrH_Kw7D2ZsBQ';

        // Переименовали переменную, чтобы не конфликтовать с глобальным объектом из CDN
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authSection = document.getElementById('auth-section');
        const uploadSection = document.getElementById('upload-section');
        const statusDiv = document.getElementById('status');

        function getCaptchaToken() {
            const el = document.querySelector('[name="cf-turnstile-response"]');
            return el ? el.value : null;
        }

        function usernameToEmail(username) {
            const cleanUsername = username.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
            if (!cleanUsername) return null;
            return `${cleanUsername}@local.app`;
        }

        document.getElementById('login-btn').onclick = async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = usernameToEmail(username);

            if (!email) { showStatus('Please enter a valid username.', true); return; }

            const captchaToken = getCaptchaToken();
            if (!captchaToken) { showStatus('Please complete the Cloudflare check.', true); return; }

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
                options: { captchaToken }
            });

            if (error) { showStatus('Login error: ' + error.message, true); }
            else { showStatus('Signed in successfully!'); checkUser(); }
        };

        document.getElementById('signup-btn').onclick = async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = usernameToEmail(username);

            if (!email) { showStatus('Please enter a valid username.', true); return; }

            const captchaToken = getCaptchaToken();
            if (!captchaToken) { showStatus('Please complete the Cloudflare check.', true); return; }

            const { error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    captchaToken: captchaToken,
                    data: { username: username.trim() }
                }
            });

            if (error) { showStatus('Sign up error: ' + error.message, true); }
            else { showStatus('Account created! You can now sign in.'); }
        };

        document.getElementById('logout-btn').onclick = async () => {
            await supabaseClient.auth.signOut();
            checkUser();
        };

        document.getElementById('upload-btn').onclick = async () => {
            const file = document.getElementById('skin-file').files[0];
            const username = document.getElementById('minecraft-username').value.trim();
            const model = document.getElementById('skin-model').value;

            if (!file || !username) { showStatus('Please select a file and enter a username.', true); return; }
            if (file.type !== 'image/png') { showStatus('File must be a PNG.', true); return; }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { showStatus('You are not signed in.', true); return; }

            const filePath = `${user.id}/${Date.now()}_${file.name}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('skins')
                .upload(filePath, file);

            if (uploadError) { showStatus('Upload error: ' + uploadError.message, true); return; }

            const { error: profileError } = await supabaseClient
                .from('profiles')
                .upsert({
                    id: user.id,
                    username: username,
                    skin_path: filePath,
                    model: model,
                    updated_at: new Date().toISOString()
                });

            if (profileError) { showStatus('Save error: ' + profileError.message, true); }
            else { showStatus('Skin uploaded successfully! Join the game.'); }
        };

        function showStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.className = isError ? 'error' : '';
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                authSection.style.display = 'none';
                uploadSection.style.display = 'block';
                const displayName = user.user_metadata?.username || user.email;
                document.getElementById('user-email').textContent = displayName;
            } else {
                authSection.style.display = 'block';
                uploadSection.style.display = 'none';
            }
        }

        checkUser();
    </script>
</body>
</html>
